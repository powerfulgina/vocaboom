import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// 👇 將你截圖上的專屬資料貼在這裡 👇
const firebaseConfig = {
  apiKey: "AIzaSyCm_X_bh02UrJhbTAWeHjvtNVCAgcQadTo",
  authDomain: "vocabapp-3586e.firebaseapp.com",
  projectId: "vocabapp-3586e",
  storageBucket: "vocabapp-3586e.firebasestorage.app",
  messagingSenderId: "119683502710",
  appId: "1:119683502710:web:d24dc34767ef41620a0557",
  measurementId: "G-KP6B1SWBPC"
};
// 👆 貼上範圍結束 👆

let db, auth, userId = null;
let isSyncing = false;
let progress = {}; 
let state = {tab: "life", fil: "novel", pos: "all", mode: "list", q: "", hideDone: false};
let flash = {order: [], i: 0, flipped: false};

// 初始化 Firebase 並與你的資料庫連線
async function initFirebase() {
  try {
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
    
    // 使用匿名登入，這樣即使不註冊帳號也能為每個設備產生專屬 ID 來記住進度
    await signInAnonymously(auth);
    userId = auth.currentUser.uid;
    console.log("Firebase 登入成功！User ID:", userId);
    
    // 綁定雲端進度資料：現在資料會存在你專屬的 'users' -> [userId] 路徑下
    const docRef = doc(db, 'users', userId);
    onSnapshot(docRef, (snap) => {
      isSyncing = true;
      if (snap.exists()) {
        progress = snap.data().words || {};
      } else {
        progress = {};
      }
      renderAll();
      isSyncing = false;
    }, (err) => {
      console.error("Firebase sync error:", err);
    });
  } catch (e) {
    console.error("Firebase 初始化失敗，請確認設定或已開啟匿名登入", e);
    renderAll();
  }
}

let saveTimer = null;
function save() {
  if (!userId || isSyncing) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const docRef = doc(db, 'users', userId);
      await setDoc(docRef, { words: progress }, { merge: true });
    } catch(e) {
      console.error("儲存至雲端失敗", e);
    }
  }, 400);
}

const $=id=>document.getElementById(id);
const posGroup=p=>(p==="v."||p==="phr. v.")?"v":p==="adj."?"adj":p==="n."?"n":"adv";
const POS_LABELS={all:"全部",v:"動詞",adj:"形容詞",n:"名詞",adv:"副詞"};

function rowsOf(tab,fil){
  const e=V.find(x=>x.tab===tab&&x.fil===fil);
  return e?e.rows:[];
}
function allWordsCount(){let t=0;V.forEach(e=>t+=e.rows.length);return t;}
function countOf(w){return progress[w]||0;}
function masteredIn(tab,fil){return rowsOf(tab,fil).filter(r=>countOf(r[0])>=7).length;}
function totalMastered(){let t=0;V.forEach(e=>e.rows.forEach(r=>{if(countOf(r[0])>=7)t++;}));return t;}

function playAudio(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = 0.85; 
  window.speechSynthesis.speak(utterance);
}

function renderAll(){renderTabs();renderFilters();renderPos();renderTop();renderMain();}

function renderTop(){
  $("totalStat").innerHTML="已熟記 <b>"+totalMastered()+"</b> / "+allWordsCount()+" 字";
  $("modeBtn").textContent=state.mode==="list"?"閃卡模式":"回到列表";
}
function renderTabs(){
  const el=$("tabs");el.innerHTML="";
  Object.keys(META).forEach(t=>{
    const b=document.createElement("button");
    b.className="tab"+(state.tab===t?" on":"");
    b.textContent=META[t].label;
    b.onclick=()=>{state.tab=t;state.fil=Object.keys(META[t].filters)[0];resetFlash();renderAll();};
    el.appendChild(b);
  });
}
function renderFilters(){
  const el=$("filChips");el.innerHTML="";
  const fs=META[state.tab].filters;
  Object.keys(fs).forEach(f=>{
    const b=document.createElement("button");
    b.className="chip"+(state.fil===f?" on":"");
    b.innerHTML=`<span>${fs[f]}</span><span class="n en-text">${masteredIn(state.tab,f)}/${rowsOf(state.tab,f).length}</span>`;
    b.onclick=()=>{state.fil=f;resetFlash();renderAll();};
    el.appendChild(b);
  });
}
function renderPos(){
  const el=$("posChips");el.innerHTML="";
  Object.keys(POS_LABELS).forEach(p=>{
    const b=document.createElement("button");
    b.className="chip"+(state.pos===p?" on":"");
    b.textContent=POS_LABELS[p];
    b.onclick=()=>{state.pos=p;resetFlash();renderAll();};
    el.appendChild(b);
  });
}
function visibleRows(){
  let rows=rowsOf(state.tab,state.fil);
  if(state.pos!=="all")rows=rows.filter(r=>posGroup(r[1])===state.pos);
  if(state.q){
    const q=state.q.toLowerCase();
    rows=rows.filter(r=>r[0].toLowerCase().includes(q)||r[6].includes(state.q));
  }
  if(state.hideDone&&state.mode==="list")rows=rows.filter(r=>countOf(r[0])<7);
  return rows;
}
function ipaHTML(r){
  let h=`<b>US</b><span class="en-text">/${r[3]}/</span>`;
  if(r[4])h+=`<b>UK</b><span class="en-text">/${r[4]}/</span>`;
  return h;
}
function dotsHTML(w){
  const c=countOf(w);
  let h='<div class="progress-area"><div class="dots" data-w="'+encodeURIComponent(w)+'">';
  for(let i=0;i<7;i++)h+=`<button class="dot${i<c?" on":""}" data-i="${i}" aria-label="第${i+1}次"></button>`;
  h+=`</div>`;
  if(c>=7)h+='<span class="mastered-badge">✓ 已熟記</span>';
  return h+"</div>";
}
function renderFilterHead(total){
  const done=masteredIn(state.tab,state.fil);
  const pct=total?Math.round(done/rowsOf(state.tab,state.fil).length*100):0;
  $("filHead").innerHTML=`
    <div class="filter-head-top">
        <h2>${META[state.tab].filters[state.fil]}</h2>
        <span class="prog-text en-text">${done} / ${rowsOf(state.tab,state.fil).length}</span>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
  `;
}

function renderMain(){
  $("listTools").style.display=state.mode==="list"?"flex":"none";
  $("filHead").style.display=state.mode==="list"?"flex":"none";
  $("footerNote").style.display=state.mode==="list"?"block":"none";
  if(state.mode==="list")renderList();else renderFlash();
}

                  </button>

$("main").addEventListener("click",ev=>{
  const speakBtn = ev.target.closest(".btn-speak");
  if(speakBtn) {
    ev.stopPropagation(); 
    const w = decodeURIComponent(speakBtn.dataset.w);
    playAudio(w);
    return;
  }

  const d=ev.target.closest(".dot");
  if(!d||state.mode!=="list")return;
  const wrap=d.closest(".dots");
  const w=decodeURIComponent(wrap.dataset.w);
  const i=+d.dataset.i;
  const c=countOf(w);
  progress[w]=(c===i+1)?i:i+1;   
  save();
  renderFilters();renderTop();renderList();
});

function resetFlash(){flash.order=[];flash.i=0;flash.flipped=false;}
function buildFlash(){
  const rows=visibleRows().filter(r=>countOf(r[0])<7);
  flash.rows=rows.slice();
  for(let i=flash.rows.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[flash.rows[i],flash.rows[j]]=[flash.rows[j],flash.rows[i]];}
  flash.i=0;flash.flipped=false;
}
function renderFlash(){
  if(!flash.rows||!flash.rows.length)buildFlash();
  const main=$("main");
  const rows=flash.rows;
  
  if(!rows.length){main.innerHTML='<div class="empty">這個範圍目前沒有需要練習的單字囉！</div>';return;}
  
  if(flash.i>=rows.length){
    main.innerHTML=`
      <div class="flash-container">
        <div class="fcard" style="min-height: 300px; text-align:center;">
          <h2 style="font-size:2rem; font-weight:900; margin-bottom:12px; color:var(--text-dark);">本輪完成 🎉</h2>
          <p style="color:var(--text-gray); font-weight:600;">共複習了 <span class="en-text" style="color:var(--theme-purple); font-weight:800;">${rows.length}</span> 張卡片</p>
        </div>
        <div class="fbtns">
          <button class="fbtn" id="backList">返回列表</button>
          <button class="fbtn know" id="again">再來一輪</button>
        </div>
      </div>`;
    $("again").onclick=()=>{buildFlash();renderFlash();};
    $("backList").onclick=()=>{state.mode="list";renderTop();renderMain();};
    return;
  }
  
  const r=rows[flash.i];
  const c=countOf(r[0]);
  let inner = '';
  
  if(!flash.flipped){
    inner = `
      <div class="fc-content fc-front">
        <div class="word-zh-large">${r[6]}</div>
        <div class="fc-hint">點擊翻看英文解答</div>

    `;
  }else{

            <div class="word-en-ans en-text" style="margin-bottom: 0;">${r[0]}</div>
            <button class="btn-speak" data-w="${encodeURIComponent(r[0])}" aria-label="聆聽發音">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 001.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06zM18.584 5.106a.75.75 0 011.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 11-1.06-1.06 8.25 8.25 0 000-11.668.75.75 0 010-1.06z"/><path d="M15.932 7.757a.75.75 0 011.061 0 4.5 4.5 0 010 6.364.75.75 0 01-1.06-1.06 3 3 0 000-4.243.75.75 0 010-1.061z"/></svg>
            </button>
        </div>
        <div class="ipa" style="margin-bottom:4px;">${ipaHTML(r)}</div>
        <div class="pos-lv">
            <span class="pos en-text">${r[1]}</span>
            <span class="lv ${r[2]} en-text">${r[2]}</span>
        </div>
        <div class="def-en en-text">${r[5]}</div>
        <div class="ex en-text">${r[7]}</div>
      </div>
    `;
  }
  
  let dotsHTML = '<div style="display:flex; gap:6px; margin-top:20px;">';
  for(let i=0;i<7;i++){
      dotsHTML += `<div style="width:16px; height:8px; border-radius:99px; background:${i<c ? 'var(--dot-filled)' : 'var(--dot-empty)'}"></div>`;
  }
  dotsHTML += '</div>';

  main.innerHTML= `
    <div class="flash-container">
      <div class="fprog en-text">${flash.i+1} / ${rows.length}</div>
      <div class="fcard-wrap">
          <div class="fcard" id="fcard" role="button" tabindex="0">
              ${inner}
          </div>
      </div>
      ${flash.flipped ? dotsHTML : ''}
      <div class="fbtns" style="opacity: ${flash.flipped ? '1' : '0'}; pointer-events: ${flash.flipped ? 'auto' : 'none'};">
        <button class="fbtn" id="fno">忘記了</button>
        <button class="fbtn know" id="fyes">記得 <span class="en-text">+1</span></button>
      </div>
      <div class="fnav">
        <button id="fshuffle">↺ 重新洗牌</button>
      </div>
    </div>`;
    
  const card=$("fcard");
  const flip=()=>{flash.flipped=!flash.flipped;renderFlash();};
  card.onclick = (e) => {
      if(e.target.closest('.fbtn') || e.target.closest('.btn-speak')) return;
      flip();
  };
  card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}};

        renderFilters();renderTop();renderFlash();
      };
  }
  $("fshuffle").onclick=()=>{buildFlash();renderFlash();};
}
